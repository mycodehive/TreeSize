[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "treesize-explorer"
dynamic = ["version"]
description = "A local-first Windows disk-space explorer with GitHub release updates"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CodeHive"}]
dependencies = [
    "PySide6==6.8.3",
    "keyring==25.6.0",
]

[project.gui-scripts]
treesize-explorer = "treesize.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "treesize.VERSION"}
